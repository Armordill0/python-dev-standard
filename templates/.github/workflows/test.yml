name: Automated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read requested Python version from config/core/library_info.json
        id: pyver
        run: |
          if [ -f config/core/library_info.json ]; then
            VER=$(python3 -c "import json; print(json.load(open('config/core/library_info.json')).get('python_version', '3.13'))")
          else
            VER="3.13"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Set up requested Python version
        id: setup_requested
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          allow-prereleases: true

      - name: Fallback to latest stable Python if requested version is unavailable
        if: steps.setup_requested.outcome == 'failure'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Emit warning on Python version fallback
        if: steps.setup_requested.outcome == 'failure'
        run: |
          echo "::warning title=Python Version Fallback::Requested Python ${{ steps.pyver.outputs.version }} from config/core/library_info.json is not available on this GitHub runner. Falling back to stable Python $(python --version)."

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f config/core/requirements.lock ]; then python -m pip install -r config/core/requirements.lock; fi
          if [ -f config/requirements.txt ]; then python -m pip install -r config/requirements.txt; fi

      - name: Run pytest
        env:
          PYTHONPATH: src
        run: pytest

  test-node:
    runs-on: ubuntu-latest
    if: hashFiles('src/user/web/package.json') != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install and run Node tests (src/user/web)
        env:
          CI: "true"
        run: |
          npm --prefix src/user/web ci
          npm --prefix src/user/web test
